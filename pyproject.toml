[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-radar"
version = "0.1.0"
description = "Agent-ready index for public Telegram channels"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.28,<4",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "curl-cffi>=0.7",
  "fastapi>=0.115,<0.140",
  "httpx>=0.27",
  "pillow>=11.0",
  "prometheus-client>=0.20",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "selectolax>=0.3.21",
  "sqlalchemy[asyncio]>=2.0",
  "tenacity>=8.5",
  "telethon>=1.43",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
embeddings = [
  "fastembed>=0.3",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
tg-radar-api = "tg_radar.api:main"
tg-radar-crawl = "tg_radar.cli:crawl_main"
tg-radar-agent = "tg_radar.cli:agent_main"
tg-radar-agent-shell = "tg_radar.cli:agent_shell_main"
tg-radar-agent-eval = "tg_radar.cli:agent_eval_main"
tg-radar-stories = "tg_radar.cli:stories_main"
tg-radar-story-catalog = "tg_radar.cli:story_catalog_main"
tg-radar-worker = "tg_radar.worker:main"
tg-radar-bot = "tg_radar.bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tg_radar = ["prompts/*.md", "config_data/*.json", "assets/airbot_backplates/*", "assets/airbot_card/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
